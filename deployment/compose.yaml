# FactoryGuard Lite — geliştirme ortamı (Aşama 0/1)
# Kullanım: docker compose -f deployment/compose.yaml up -d postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: factoryguard
      POSTGRES_USER: factoryguard
      POSTGRES_PASSWORD: ${FG_DB_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:5432:5432"   # yalnızca localhost
    volumes:
      - fg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryguard -d factoryguard"]
      interval: 5s
      retries: 10
volumes:
  fg_pgdata:
